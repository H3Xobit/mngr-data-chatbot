<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MNGR · Data Assistant</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2334d399'/><stop offset='1' stop-color='%236e7bff'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='url(%23g)'/><text x='16' y='22' text-anchor='middle' font-family='-apple-system,Segoe UI,sans-serif' font-size='18' font-weight='800' fill='white'>M</text></svg>"
    />
    <style>
      :root {
        --bg: #0b0c10;
        --panel: #14161c;
        --panel-2: #1b1e26;
        --border: #262a33;
        --text: #e6e8ee;
        --muted: #8b91a0;
        --accent: #34d399;
        --accent-2: #6e7bff;
        --ok: #34d399;
        --err: #f87171;
        --bubble-user: linear-gradient(180deg, #1f3a32 0%, #1a2e2a 100%);
        --bubble-bot: #14161c;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%;
        background:
          radial-gradient(1200px 600px at 80% -10%, rgba(52, 211, 153, 0.15), transparent 60%),
          radial-gradient(900px 500px at -10% 110%, rgba(110, 123, 255, 0.15), transparent 60%),
          var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter,
          Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 15px;
      }
      .app {
        max-width: 820px; margin: 0 auto; height: 100%;
        display: flex; flex-direction: column;
        padding: 24px 20px; gap: 16px;
      }
      header { display: flex; align-items: center; gap: 12px; padding: 4px 2px; }
      .logo {
        width: 34px; height: 34px; border-radius: 9px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        display: grid; place-items: center;
        font-weight: 800; color: white;
        box-shadow: 0 6px 24px rgba(52, 211, 153, 0.35);
      }
      header h1 { font-size: 16px; margin: 0; font-weight: 600; }
      header .sub { color: var(--muted); font-size: 12.5px; }
      header .spacer { flex: 1; }
      .btn {
        appearance: none; border: 1px solid var(--border);
        background: var(--panel); color: var(--text);
        padding: 8px 14px; border-radius: 10px;
        font-size: 13px; cursor: pointer;
      }
      .btn:hover { border-color: #3a4055; }
      .btn.primary {
        background: linear-gradient(180deg, var(--accent), var(--accent-2));
        border-color: transparent; color: white; font-weight: 600;
      }
      .btn.ghost { background: transparent; }
      .chat {
        flex: 1; min-height: 0;
        display: flex; flex-direction: column;
        background: var(--panel); border: 1px solid var(--border);
        border-radius: 16px; overflow: hidden;
      }
      .messages {
        flex: 1; overflow-y: auto; padding: 18px;
        display: flex; flex-direction: column; gap: 12px;
        scroll-behavior: smooth;
      }
      .msg { display: flex; max-width: 92%; line-height: 1.45; }
      .msg .bubble {
        padding: 10px 14px; border-radius: 14px;
        white-space: pre-wrap; word-wrap: break-word;
        max-width: 100%;
      }
      .msg.bot { align-self: flex-start; flex-direction: column; }
      .msg.bot .bubble {
        background: var(--bubble-bot);
        border: 1px solid var(--border);
        border-top-left-radius: 4px;
      }
      .msg.user { align-self: flex-end; }
      .msg.user .bubble {
        background: var(--bubble-user);
        border: 1px solid #2a3d3a;
        border-top-right-radius: 4px;
      }
      .msg.system .bubble {
        background: rgba(52, 211, 153, 0.08);
        border: 1px dashed rgba(52, 211, 153, 0.45);
        font-size: 13px;
      }
      .typing .bubble { color: var(--muted); font-style: italic; }
      .typing .dots span {
        display: inline-block; width: 5px; height: 5px;
        margin: 0 1px; border-radius: 50%; background: var(--muted);
        animation: blink 1.2s infinite ease-in-out;
      }
      .typing .dots span:nth-child(2) { animation-delay: 0.15s; }
      .typing .dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes blink { 0%, 80%, 100% { opacity: 0.2 } 40% { opacity: 1 } }

      .sql-panel {
        margin-top: 6px; max-width: 100%;
        font-size: 12.5px;
      }
      .sql-panel summary {
        cursor: pointer; user-select: none;
        color: var(--muted); padding: 4px 2px;
        list-style: none;
      }
      .sql-panel summary::-webkit-details-marker { display: none; }
      .sql-panel summary::before { content: "▶ "; font-size: 9px; margin-right: 4px; }
      .sql-panel[open] summary::before { content: "▼ "; }
      .sql-panel pre {
        margin: 6px 0 0; padding: 10px 12px;
        background: #0d0e13; border: 1px solid var(--border);
        border-radius: 8px; overflow-x: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px; color: #d9def0;
        white-space: pre-wrap;
      }
      .sql-panel .meta {
        color: var(--muted); font-size: 11.5px;
        margin-top: 4px;
      }

      .composer {
        border-top: 1px solid var(--border);
        background: var(--panel-2);
        padding: 12px;
        display: flex; gap: 10px; align-items: flex-end;
      }
      .composer textarea {
        flex: 1; background: var(--panel); color: var(--text);
        border: 1px solid var(--border); border-radius: 12px;
        padding: 10px 12px; font: inherit; resize: none;
        max-height: 160px; min-height: 42px; outline: none;
      }
      .composer textarea:focus { border-color: var(--accent); }

      .suggested {
        display: flex; gap: 8px; flex-wrap: wrap;
        padding: 0 18px 10px; border-top: 1px solid var(--border);
        padding-top: 10px;
      }
      .suggested button {
        font-size: 12px; padding: 6px 10px;
        border-radius: 999px; border: 1px solid var(--border);
        background: var(--panel-2); color: var(--text); cursor: pointer;
      }
      .suggested button:hover { border-color: var(--accent); color: var(--accent); }

      footer {
        color: var(--muted); font-size: 11.5px;
        text-align: center; padding-top: 4px;
      }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="logo">M</div>
        <div>
          <h1>MNGR Data Assistant</h1>
          <div class="sub">Ask questions about e-commerce and customer support data in plain English.</div>
        </div>
        <div class="spacer"></div>
        <button id="resetBtn" class="btn ghost">Reset</button>
      </header>

      <div class="chat">
        <div id="messages" class="messages"></div>
        <div class="suggested" id="suggested">
          <button data-q="Show me all orders from Alice Chen in the last month.">Orders for Alice last month</button>
          <button data-q="List all open support tickets for Ben Okafor.">Open tickets for Ben</button>
          <button data-q="What is the total order value for each customer who has opened support tickets?">Total orders for ticket-raisers</button>
          <button data-q="Find customers who have made purchases but never raised support tickets.">Purchasers w/o tickets</button>
        </div>
        <div class="composer">
          <textarea
            id="input"
            rows="1"
            placeholder="Ask a question about the data..."
            autofocus
          ></textarea>
          <button id="sendBtn" class="btn primary">Send</button>
        </div>
      </div>

      <footer>
        Built for the MNGR technical task · FastAPI · Groq llama-3.3-70b · SQLite (read-only)
      </footer>
    </div>

    <script>
      const $ = (sel) => document.querySelector(sel);
      const messagesEl = $("#messages");
      const inputEl = $("#input");
      const sendBtn = $("#sendBtn");
      const resetBtn = $("#resetBtn");
      let busy = false;

      function addMessage(role, text, extra) {
        const wrap = document.createElement("div");
        wrap.className = `msg ${role}`;
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;
        wrap.appendChild(bubble);

        if (extra && extra.queries && extra.queries.length) {
          extra.queries.forEach((q, idx) => {
            const det = document.createElement("details");
            det.className = "sql-panel";
            const sum = document.createElement("summary");
            const label =
              extra.queries.length === 1
                ? "View SQL"
                : `View SQL #${idx + 1}`;
            sum.textContent = `${label}  ·  ${q.row_count} row${q.row_count === 1 ? "" : "s"}${q.truncated ? " (truncated)" : ""}`;
            const pre = document.createElement("pre");
            pre.textContent = q.sql;
            det.appendChild(sum);
            det.appendChild(pre);
            wrap.appendChild(det);
          });
        }

        messagesEl.appendChild(wrap);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return wrap;
      }

      function addTyping() {
        const wrap = document.createElement("div");
        wrap.className = "msg bot typing";
        wrap.innerHTML = `<div class="bubble"><span class="dots"><span></span><span></span><span></span></span> thinking</div>`;
        messagesEl.appendChild(wrap);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return wrap;
      }

      async function send(text) {
        text = (text ?? inputEl.value).trim();
        if (!text || busy) return;
        busy = true;
        sendBtn.disabled = true;
        inputEl.value = "";
        inputEl.style.height = "auto";
        addMessage("user", text);
        const typing = addTyping();
        try {
          const r = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text }),
          });
          const data = await r.json();
          typing.remove();
          if (!r.ok) {
            addMessage("system", `Error: ${data.detail || r.statusText}`);
            return;
          }
          addMessage("bot", data.reply, { queries: data.queries });
        } catch (err) {
          typing.remove();
          addMessage("system", `Network error: ${err.message}`);
        } finally {
          busy = false;
          sendBtn.disabled = false;
          inputEl.focus();
        }
      }

      async function reset() {
        await fetch("/chat/reset", { method: "POST" });
        messagesEl.innerHTML = "";
        greet();
      }

      function greet() {
        addMessage(
          "bot",
          "Hi - I'm MNGR's data assistant. Ask me anything about the e-commerce and customer-support datasets. Each answer comes with the SQL I ran, in a collapsible panel below it."
        );
      }

      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });
      inputEl.addEventListener("input", () => {
        inputEl.style.height = "auto";
        inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
      });
      sendBtn.addEventListener("click", () => send());
      resetBtn.addEventListener("click", reset);

      document.querySelectorAll("#suggested button").forEach((b) => {
        b.addEventListener("click", () => send(b.dataset.q));
      });

      greet();
    </script>
  </body>
</html>
