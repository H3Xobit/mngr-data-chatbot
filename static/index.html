<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MNGR · Data Assistant</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2334d399'/><stop offset='1' stop-color='%236e7bff'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='url(%23g)'/><text x='16' y='22' text-anchor='middle' font-family='-apple-system,Segoe UI,sans-serif' font-size='18' font-weight='800' fill='white'>M</text></svg>"
    />
    <style>
      :root {
        --bg: #0b0c10;
        --panel: #14161c;
        --panel-2: #1b1e26;
        --border: #262a33;
        --text: #e6e8ee;
        --muted: #8b91a0;
        --accent: #34d399;
        --accent-2: #6e7bff;
        --ok: #34d399;
        --err: #f87171;
        --bubble-user: linear-gradient(180deg, #1f3a32 0%, #1a2e2a 100%);
        --bubble-bot: #14161c;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%;
        background:
          radial-gradient(1200px 600px at 80% -10%, rgba(52, 211, 153, 0.15), transparent 60%),
          radial-gradient(900px 500px at -10% 110%, rgba(110, 123, 255, 0.15), transparent 60%),
          var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter,
          Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 15px;
      }
      .app {
        max-width: 820px; margin: 0 auto; height: 100%;
        display: flex; flex-direction: column;
        padding: 24px 20px; gap: 16px;
      }
      header { display: flex; align-items: center; gap: 12px; padding: 4px 2px; }
      .logo {
        width: 34px; height: 34px; border-radius: 9px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        display: grid; place-items: center;
        font-weight: 800; color: white;
        box-shadow: 0 6px 24px rgba(52, 211, 153, 0.35);
      }
      header h1 { font-size: 16px; margin: 0; font-weight: 600; }
      header .sub { color: var(--muted); font-size: 12.5px; }
      header .spacer { flex: 1; }
      .pill {
        font-size: 12px; padding: 6px 10px; border-radius: 999px;
        border: 1px solid var(--border); background: var(--panel);
        color: var(--muted);
        display: inline-flex; align-items: center; gap: 6px;
      }
      .pill .dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--accent);
      }
      .pill.ok .dot { background: var(--ok); }
      .btn {
        appearance: none; border: 1px solid var(--border);
        background: var(--panel); color: var(--text);
        padding: 8px 14px; border-radius: 10px;
        font-size: 13px; cursor: pointer;
      }
      .btn:hover { border-color: #3a4055; }
      .btn.primary {
        background: linear-gradient(180deg, var(--accent), var(--accent-2));
        border-color: transparent; color: white; font-weight: 600;
      }
      .btn.ghost { background: transparent; }
      .chat {
        flex: 1; min-height: 0;
        display: flex; flex-direction: column;
        background: var(--panel); border: 1px solid var(--border);
        border-radius: 16px; overflow: hidden;
      }
      .messages {
        flex: 1; overflow-y: auto; padding: 18px;
        display: flex; flex-direction: column; gap: 12px;
        scroll-behavior: smooth;
      }
      .msg { display: flex; max-width: 92%; line-height: 1.45; }
      .msg .bubble {
        padding: 10px 14px; border-radius: 14px;
        white-space: pre-wrap; word-wrap: break-word;
        max-width: 100%;
      }
      .msg.bot { align-self: flex-start; flex-direction: column; }
      .msg.bot .bubble {
        background: var(--bubble-bot);
        border: 1px solid var(--border);
        border-top-left-radius: 4px;
      }
      .msg.user { align-self: flex-end; }
      .msg.user .bubble {
        background: var(--bubble-user);
        border: 1px solid #2a3d3a;
        border-top-right-radius: 4px;
      }
      .msg.system .bubble {
        background: rgba(52, 211, 153, 0.08);
        border: 1px dashed rgba(52, 211, 153, 0.45);
        font-size: 13px;
      }
      .typing .bubble { color: var(--muted); font-style: italic; }
      .typing .dots span {
        display: inline-block; width: 5px; height: 5px;
        margin: 0 1px; border-radius: 50%; background: var(--muted);
        animation: blink 1.2s infinite ease-in-out;
      }
      .typing .dots span:nth-child(2) { animation-delay: 0.15s; }
      .typing .dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes blink { 0%, 80%, 100% { opacity: 0.2 } 40% { opacity: 1 } }

      .sql-panel {
        margin-top: 6px; max-width: 100%;
        font-size: 12.5px;
      }
      .sql-panel summary {
        cursor: pointer; user-select: none;
        color: var(--muted); padding: 4px 2px;
        list-style: none;
      }
      .sql-panel summary::-webkit-details-marker { display: none; }
      .sql-panel summary::before { content: "▶ "; font-size: 9px; margin-right: 4px; }
      .sql-panel[open] summary::before { content: "▼ "; }
      .sql-panel pre {
        margin: 6px 0 0; padding: 10px 12px;
        background: #0d0e13; border: 1px solid var(--border);
        border-radius: 8px; overflow-x: auto;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px; color: #d9def0;
        white-space: pre-wrap;
      }
      .sql-panel .meta {
        color: var(--muted); font-size: 11.5px;
        margin-top: 4px;
      }
      .sql-panel .actions {
        display: flex; gap: 8px; margin-top: 8px;
        flex-wrap: wrap;
      }
      .sql-panel .actions button {
        appearance: none; font-size: 11.5px; padding: 4px 10px;
        border-radius: 999px; border: 1px solid var(--border);
        background: var(--panel-2); color: var(--text); cursor: pointer;
      }
      .sql-panel .actions button:hover { border-color: var(--accent); color: var(--accent); }
      .chart-wrap {
        margin-top: 10px; padding: 8px;
        background: #0d0e13; border: 1px solid var(--border);
        border-radius: 8px;
        max-width: 100%;
      }
      .chart-wrap canvas {
        max-width: 100%; height: auto !important;
      }
      .results-table {
        margin-top: 8px;
        max-height: 240px; overflow: auto;
        border: 1px solid var(--border); border-radius: 8px;
      }
      .results-table table {
        border-collapse: collapse; width: 100%;
        font-size: 12px;
      }
      .results-table th, .results-table td {
        padding: 6px 10px; border-bottom: 1px solid var(--border);
        text-align: left; white-space: nowrap;
      }
      .results-table th {
        background: var(--panel-2); position: sticky; top: 0;
        font-weight: 600; color: var(--muted);
      }

      /* History drawer */
      .history-drawer {
        position: fixed; top: 0; right: 0; bottom: 0;
        width: 380px; max-width: 90vw;
        background: var(--panel); border-left: 1px solid var(--border);
        box-shadow: -8px 0 30px rgba(0,0,0,0.4);
        transform: translateX(100%);
        transition: transform 0.2s ease;
        display: flex; flex-direction: column;
        z-index: 100;
      }
      .history-drawer.open { transform: translateX(0); }
      .history-drawer header {
        padding: 14px 16px; border-bottom: 1px solid var(--border);
        display: flex; align-items: center; gap: 8px;
      }
      .history-drawer header h2 {
        font-size: 14px; margin: 0; font-weight: 600;
      }
      .history-list {
        flex: 1; overflow-y: auto; padding: 10px;
        display: flex; flex-direction: column; gap: 8px;
      }
      .history-item {
        background: var(--panel-2); border: 1px solid var(--border);
        border-radius: 8px; padding: 10px 12px;
        font-size: 12.5px; cursor: pointer;
      }
      .history-item:hover { border-color: var(--accent); }
      .history-item .h-q {
        color: var(--muted); margin-bottom: 4px;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .history-item .h-sql {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px; color: #d9def0;
        max-height: 60px; overflow: hidden;
        white-space: pre-wrap;
      }

      .composer {
        border-top: 1px solid var(--border);
        background: var(--panel-2);
        padding: 12px;
        display: flex; gap: 10px; align-items: flex-end;
      }
      .composer textarea {
        flex: 1; background: var(--panel); color: var(--text);
        border: 1px solid var(--border); border-radius: 12px;
        padding: 10px 12px; font: inherit; resize: none;
        max-height: 160px; min-height: 42px; outline: none;
      }
      .composer textarea:focus { border-color: var(--accent); }

      .suggested {
        display: flex; gap: 8px; flex-wrap: wrap;
        padding: 0 18px 10px; border-top: 1px solid var(--border);
        padding-top: 10px;
      }
      .suggested button {
        font-size: 12px; padding: 6px 10px;
        border-radius: 999px; border: 1px solid var(--border);
        background: var(--panel-2); color: var(--text); cursor: pointer;
      }
      .suggested button:hover { border-color: var(--accent); color: var(--accent); }

      footer {
        color: var(--muted); font-size: 11.5px;
        text-align: center; padding-top: 4px;
      }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="logo">M</div>
        <div>
          <h1>MNGR Data Assistant</h1>
          <div class="sub">Ask questions about e-commerce and customer support data in plain English.</div>
        </div>
        <div class="spacer"></div>
        <span id="personaPill" class="pill" title="Demo row-level access control" style="display:none"><span class="dot"></span><span id="personaText"></span></span>
        <button id="personaBtn" class="btn ghost" title="Try row-level access control">Persona</button>
        <button id="historyBtn" class="btn ghost" title="Show query history">History</button>
        <button id="resetBtn" class="btn ghost">Reset</button>
      </header>

      <aside id="historyDrawer" class="history-drawer">
        <header>
          <h2>Session query history</h2>
          <span style="flex:1"></span>
          <button id="historyCloseBtn" class="btn ghost">Close</button>
        </header>
        <div id="historyList" class="history-list"></div>
      </aside>

      <div class="chat">
        <div id="messages" class="messages"></div>
        <div class="suggested" id="suggested">
          <button data-q="Show me all orders from Alice Chen in the last month.">Orders for Alice last month</button>
          <button data-q="List all open support tickets for Ben Okafor.">Open tickets for Ben</button>
          <button data-q="What is the total order value for each customer who has opened support tickets?">Total orders for ticket-raisers</button>
          <button data-q="Find customers who have made purchases but never raised support tickets.">Purchasers w/o tickets</button>
        </div>
        <div class="composer">
          <textarea
            id="input"
            rows="1"
            placeholder="Ask a question about the data..."
            autofocus
          ></textarea>
          <button id="sendBtn" class="btn primary">Send</button>
        </div>
      </div>

      <footer>
        Built for the MNGR technical task · FastAPI · Groq llama-3.3-70b · SQLite (read-only)
      </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script>
      const $ = (sel) => document.querySelector(sel);
      const messagesEl = $("#messages");
      const inputEl = $("#input");
      const sendBtn = $("#sendBtn");
      const resetBtn = $("#resetBtn");
      const historyBtn = $("#historyBtn");
      const historyDrawer = $("#historyDrawer");
      const historyCloseBtn = $("#historyCloseBtn");
      const historyListEl = $("#historyList");
      const personaBtn = $("#personaBtn");
      const personaPill = $("#personaPill");
      const personaText = $("#personaText");
      let busy = false;

      async function refreshPersona() {
        try {
          const r = await fetch("/auth/persona");
          const data = await r.json();
          if (data.email) {
            personaPill.style.display = "inline-flex";
            personaPill.classList.add("ok");
            personaText.textContent = `Scoped to: ${data.email}`;
            personaBtn.textContent = "Switch / clear persona";
          } else {
            personaPill.style.display = "none";
            personaBtn.textContent = "Persona";
          }
        } catch (e) { /* non-fatal */ }
      }

      async function choosePersona() {
        const current = personaText.textContent.replace(/^Scoped to:\s*/, "");
        const next = prompt(
          "Demo: enter a customer email to scope queries to that user only " +
          "(simulates row-level access control). Leave empty to clear.",
          current || "alice.chen@example.com"
        );
        if (next === null) return;
        const email = next.trim();
        const r = await fetch("/auth/persona", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: email || null }),
        });
        if (!r.ok) {
          alert("Could not set persona: " + (await r.text()));
          return;
        }
        // Persona change forces a new conversation server-side; mirror that locally.
        messagesEl.innerHTML = "";
        history.length = 0;
        renderHistory();
        await refreshPersona();
        greet();
      }
      personaBtn.addEventListener("click", choosePersona);

      // Per-session query history (in-memory; cleared on Reset).
      const history = [];

      function downloadBlob(filename, mimeType, content) {
        const blob = new Blob([content], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      function toCSV(columns, rows) {
        const escape = (v) => {
          if (v == null) return "";
          const s = String(v);
          if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
          return s;
        };
        const head = columns.map(escape).join(",");
        const body = rows
          .map((r) => columns.map((c) => escape(r[c])).join(","))
          .join("\n");
        return head + "\n" + body;
      }

      function pickChartableColumns(columns, rows) {
        if (!rows.length) return null;
        // We need one categorical (string) column and at least one numeric column.
        const numeric = [];
        let label = null;
        for (const c of columns) {
          const sample = rows.find((r) => r[c] != null);
          if (sample == null) continue;
          const v = sample[c];
          if (typeof v === "number") {
            numeric.push(c);
          } else if (label === null && typeof v === "string") {
            label = c;
          }
        }
        if (label && numeric.length >= 1 && rows.length <= 40) {
          return { label, numeric };
        }
        return null;
      }

      function renderChart(container, columns, rows) {
        const pick = pickChartableColumns(columns, rows);
        if (!pick) return false;
        const canvas = document.createElement("canvas");
        const wrap = document.createElement("div");
        wrap.className = "chart-wrap";
        wrap.appendChild(canvas);
        container.appendChild(wrap);

        const labels = rows.map((r) => r[pick.label]);
        const datasets = pick.numeric.map((c, i) => ({
          label: c,
          data: rows.map((r) => Number(r[c])),
          backgroundColor: i === 0
            ? "rgba(52, 211, 153, 0.6)"
            : "rgba(110, 123, 255, 0.6)",
          borderColor: i === 0
            ? "rgba(52, 211, 153, 1)"
            : "rgba(110, 123, 255, 1)",
          borderWidth: 1,
        }));
        // eslint-disable-next-line no-undef
        new Chart(canvas, {
          type: "bar",
          data: { labels, datasets },
          options: {
            responsive: true,
            plugins: { legend: { display: pick.numeric.length > 1 } },
            scales: {
              x: { ticks: { color: "#8b91a0" }, grid: { color: "#1b1e26" } },
              y: { ticks: { color: "#8b91a0" }, grid: { color: "#1b1e26" } },
            },
          },
        });
        return true;
      }

      function renderResultsTable(container, columns, rows) {
        if (!rows.length) return;
        const wrap = document.createElement("div");
        wrap.className = "results-table";
        const table = document.createElement("table");
        const thead = document.createElement("thead");
        const headRow = document.createElement("tr");
        for (const c of columns) {
          const th = document.createElement("th");
          th.textContent = c;
          headRow.appendChild(th);
        }
        thead.appendChild(headRow); table.appendChild(thead);
        const tbody = document.createElement("tbody");
        for (const r of rows) {
          const tr = document.createElement("tr");
          for (const c of columns) {
            const td = document.createElement("td");
            const v = r[c];
            td.textContent = v == null ? "" : String(v);
            tr.appendChild(td);
          }
          tbody.appendChild(tr);
        }
        table.appendChild(tbody); wrap.appendChild(table);
        container.appendChild(wrap);
      }

      function buildSqlPanel(q, idx, total, userQuestion) {
        const det = document.createElement("details");
        det.className = "sql-panel";
        const sum = document.createElement("summary");
        const label = total === 1 ? "View SQL & results" : `Query #${idx + 1}`;
        sum.textContent = `${label}  ·  ${q.row_count} row${q.row_count === 1 ? "" : "s"}${q.truncated ? " (truncated)" : ""}`;
        det.appendChild(sum);

        const pre = document.createElement("pre");
        pre.textContent = q.sql;
        det.appendChild(pre);

        // Result preview table (if rows came back) + actions.
        if (q.rows && q.rows.length) {
          renderChart(det, q.columns || [], q.rows);
          renderResultsTable(det, q.columns || [], q.rows);

          const actions = document.createElement("div");
          actions.className = "actions";

          const csvBtn = document.createElement("button");
          csvBtn.textContent = "Download CSV";
          csvBtn.addEventListener("click", () => {
            const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
            downloadBlob(`result-${stamp}.csv`, "text/csv", toCSV(q.columns || [], q.rows));
          });
          actions.appendChild(csvBtn);

          const jsonBtn = document.createElement("button");
          jsonBtn.textContent = "Download JSON";
          jsonBtn.addEventListener("click", () => {
            const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
            downloadBlob(
              `result-${stamp}.json`,
              "application/json",
              JSON.stringify({ sql: q.sql, columns: q.columns, rows: q.rows }, null, 2)
            );
          });
          actions.appendChild(jsonBtn);

          const copyBtn = document.createElement("button");
          copyBtn.textContent = "Copy SQL";
          copyBtn.addEventListener("click", () => {
            navigator.clipboard.writeText(q.sql).then(() => {
              copyBtn.textContent = "Copied!";
              setTimeout(() => (copyBtn.textContent = "Copy SQL"), 1200);
            });
          });
          actions.appendChild(copyBtn);

          det.appendChild(actions);
        }

        // Push into history.
        history.push({ ts: new Date(), userQuestion, query: q });
        renderHistory();

        return det;
      }

      function renderHistory() {
        historyListEl.innerHTML = "";
        if (!history.length) {
          const empty = document.createElement("div");
          empty.style.cssText = "color: var(--muted); padding: 16px; font-size: 12.5px;";
          empty.textContent = "Your queries this session will appear here. They are kept in your browser only.";
          historyListEl.appendChild(empty);
          return;
        }
        for (const h of [...history].reverse()) {
          const item = document.createElement("div");
          item.className = "history-item";
          const q = document.createElement("div");
          q.className = "h-q";
          q.textContent = `[${h.ts.toLocaleTimeString()}] ${h.userQuestion}`;
          const sql = document.createElement("div");
          sql.className = "h-sql";
          sql.textContent = h.query.sql;
          item.appendChild(q); item.appendChild(sql);
          item.addEventListener("click", () => {
            inputEl.value = h.userQuestion;
            historyDrawer.classList.remove("open");
            inputEl.focus();
          });
          historyListEl.appendChild(item);
        }
      }
      renderHistory();

      historyBtn.addEventListener("click", () => historyDrawer.classList.toggle("open"));
      historyCloseBtn.addEventListener("click", () => historyDrawer.classList.remove("open"));

      function addMessage(role, text, extra) {
        const wrap = document.createElement("div");
        wrap.className = `msg ${role}`;
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;
        wrap.appendChild(bubble);

        if (extra && extra.queries && extra.queries.length) {
          extra.queries.forEach((q, idx) => {
            const det = buildSqlPanel(q, idx, extra.queries.length, extra.userQuestion || "");
            wrap.appendChild(det);
          });
        }

        messagesEl.appendChild(wrap);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return wrap;
      }

      function addTyping() {
        const wrap = document.createElement("div");
        wrap.className = "msg bot typing";
        wrap.innerHTML = `<div class="bubble"><span class="dots"><span></span><span></span><span></span></span> thinking</div>`;
        messagesEl.appendChild(wrap);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return wrap;
      }

      async function send(text) {
        text = (text ?? inputEl.value).trim();
        if (!text || busy) return;
        busy = true;
        sendBtn.disabled = true;
        inputEl.value = "";
        inputEl.style.height = "auto";
        addMessage("user", text);
        const typing = addTyping();
        try {
          const r = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text }),
          });
          const data = await r.json();
          typing.remove();
          if (!r.ok) {
            addMessage("system", `Error: ${data.detail || r.statusText}`);
            return;
          }
          addMessage("bot", data.reply, { queries: data.queries, userQuestion: text });
        } catch (err) {
          typing.remove();
          addMessage("system", `Network error: ${err.message}`);
        } finally {
          busy = false;
          sendBtn.disabled = false;
          inputEl.focus();
        }
      }

      async function reset() {
        await fetch("/chat/reset", { method: "POST" });
        messagesEl.innerHTML = "";
        history.length = 0;
        renderHistory();
        greet();
      }

      function greet() {
        addMessage(
          "bot",
          "Hi - I'm MNGR's data assistant. Ask me anything about the e-commerce and customer-support datasets. Each answer comes with the SQL I ran, in a collapsible panel below it."
        );
      }

      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });
      inputEl.addEventListener("input", () => {
        inputEl.style.height = "auto";
        inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
      });
      sendBtn.addEventListener("click", () => send());
      resetBtn.addEventListener("click", reset);

      document.querySelectorAll("#suggested button").forEach((b) => {
        b.addEventListener("click", () => send(b.dataset.q));
      });

      greet();
      refreshPersona();
    </script>
  </body>
</html>
